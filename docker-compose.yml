services:

  # ── Base de datos ─────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aegifinance-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: ${MSSQL_PID:-Express}
      TZ: ${TZ:-America/Mexico_City}
    volumes:
      - aegifinance-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - aegifinance

  # ── API backend ───────────────────────────────────────────────────────────────
  web:
    image: aegifinance-web:latest
    container_name: aegifinance-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/AegiFinance.Web/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;Database=AegiFinanceDb;
        User Id=sa;Password=${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in .env};
        Encrypt=True;TrustServerCertificate=True;
      JwtSettings__Secret: ${JWT_SECRET:?Define JWT_SECRET in .env}
      JwtSettings__Issuer: AegiFinance
      JwtSettings__Audience: AegiFinance
      JwtSettings__ExpiryMinutes: 15
      Security__MaxFailedLoginAttempts: ${SECURITY_MAX_FAILED_LOGIN_ATTEMPTS:-5}
      Security__LockoutMinutes: ${SECURITY_LOCKOUT_MINUTES:-15}
      Security__SessionLifetimeDays: ${SECURITY_SESSION_LIFETIME_DAYS:-7}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS in .env}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:?Define ADMIN_SEED_PASSWORD in .env}
      ExchangeRateApi__BaseUrl: ${EXCHANGE_RATE_BASE_URL:-https://api.exchangerate-api.com/v4/latest/}
      ExchangeRateApi__ApiKey: ${EXCHANGE_RATE_API_KEY:-}
      ExchangeRateApi__Enabled: ${EXCHANGE_RATE_ENABLED:-false}
      DataProtection__KeysPath: /app/keys
      ClientDocuments__Path: /app/data/client-documents
      TZ: ${TZ:-America/Mexico_City}
    volumes:
      - aegifinance-dataprotection-keys:/app/keys
      - aegifinance-client-documents:/app/data/client-documents
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - aegifinance
    init: true
    stop_grace_period: 30s

  # ── Worker de facturación ─────────────────────────────────────────────────────
  worker:
    image: aegifinance-worker:latest
    container_name: aegifinance-worker
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/AegiFinance.Worker/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;Database=AegiFinanceDb;
        User Id=sa;Password=${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in .env};
        Encrypt=True;TrustServerCertificate=True;
      JwtSettings__Secret: ${JWT_SECRET:?Define JWT_SECRET in .env}
      JwtSettings__Issuer: AegiFinance
      JwtSettings__Audience: AegiFinance
      ExchangeRateApi__BaseUrl: ${EXCHANGE_RATE_BASE_URL:-https://api.exchangerate-api.com/v4/latest/}
      ExchangeRateApi__ApiKey: ${EXCHANGE_RATE_API_KEY:-}
      ExchangeRateApi__Enabled: ${EXCHANGE_RATE_ENABLED:-false}
      Billing__DailyRunTime: ${BILLING_DAILY_RUN_TIME:-02:00}
      DataProtection__KeysPath: /app/keys
      TZ: ${TZ:-America/Mexico_City}
    volumes:
      - aegifinance-dataprotection-keys:/app/keys
    networks:
      - aegifinance
    init: true
    stop_grace_period: 60s

  # ── Frontend Next.js ──────────────────────────────────────────────────────────
  frontend:
    image: aegifinance-frontend:latest
    container_name: aegifinance-frontend
    restart: unless-stopped
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: http://web:8080
    depends_on:
      web:
        condition: service_healthy
    environment:
      # URL interna al contenedor de la API (server-side rewrite en Next.js)
      INTERNAL_API_URL: http://web:8080
      NODE_ENV: production
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - aegifinance
      - proxy
    init: true
    stop_grace_period: 30s

volumes:
  aegifinance-sql-data:
  aegifinance-dataprotection-keys:
  aegifinance-client-documents:

networks:
  aegifinance:
    driver: bridge
  proxy:
    name: ${PROXY_NETWORK_NAME:-aegifinance-proxy}
    external: ${PROXY_NETWORK_EXTERNAL:-false}
