<!doctype html>
<!-- @dsCard group="UI Kit — Shendevour Web" name="UI Kit · SHEndevour Web (Dashboard)" subtitle="Click-thru — Dashboard, Restaurante, Reproceso (sidebar)" viewport="1280x720" -->
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHEndevour Web — UI Kit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="styles.css" />
<style>
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-flat.active { color: var(--primary); background: rgba(25,118,210,.08); }

  /* Empty placeholder for not-yet-built screens */
  .empty-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--gray-muted); background: var(--page-bg); }
  .empty-screen .mi { font-size: 56px; color: var(--gray-line); }
  .empty-screen h3 { font-family: var(--font-display); font-size: 16px; color: var(--gray-dark); font-weight: 700; }
  .empty-screen p  { font-size: 13px; max-width: 380px; text-align: center; line-height: 1.45; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components/Atoms.jsx"></script>
<script type="text/babel" src="components/Shell.jsx"></script>
<script type="text/babel" src="components/Dashboard.jsx"></script>
<script type="text/babel" src="components/Reproceso.jsx"></script>
<script type="text/babel" src="components/Restaurant.jsx"></script>

<script type="text/babel" data-presets="react">
function EmptyScreen({ icon, title, msg }) {
  return (
    <div className="empty-screen">
      <span className="mi material-symbols-rounded">{icon}</span>
      <h3>{title}</h3>
      <p>{msg}</p>
    </div>
  );
}

const VIEW_TITLE = {
  dashboard:    "Dashboard",
  metrics:      "Métricas del Turno",
  rooms:        "Habitaciones",
  checkins:     "Registros",
  reservations: "Reservas",
  caja:         "Caja",
  restaurant:   "Restaurante",
  reproceso:    "Reproceso",
  billing:      "Facturación",
  reports:      "Reportes",
  settings:     "Configuración",
  users:        "Usuarios",
};

function App() {
  const [active, setActive] = React.useState("dashboard");
  const [loading, setLoading] = React.useState(false);

  const refresh = () => {
    setLoading(true);
    setTimeout(() => setLoading(false), 900);
  };

  let body;
  if (active === "dashboard") body = <DashboardView isLoading={loading} onRefresh={refresh} />;
  else if (active === "reproceso") body = <ReprocesoView isLoading={loading} onRefresh={refresh} />;
  else if (active === "restaurant") body = <RestaurantView isLoading={loading} onRefresh={refresh} />;
  else {
    body = (
      <React.Fragment>
        <ContentHeader
          title={VIEW_TITLE[active]}
          right={<button className="btn-refresh" onClick={refresh}><MIcon name="refresh" />Actualizar</button>}
        />
        <EmptyScreen
          icon="construction"
          title="Módulo no implementado en este kit"
          msg={"El UI Kit recrea “Dashboard” y “Reproceso” como ejemplos de los dos patrones principales (lectura densa y operación). Otros módulos del producto compartirían los mismos componentes."}
        />
      </React.Fragment>
    );
  }

  return (
    <div className="shell">
      <Titlebar view={VIEW_TITLE[active]} />
      <Sidebar active={active} onNav={setActive} />
      <main className="main">{body}</main>
      <Statusbar />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
