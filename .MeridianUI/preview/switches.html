<!doctype html>
<!-- @dsCard group="Components" name="Components · Switches, radios & checkboxes" subtitle="Toggle switch, radio, checkbox (on/off/indeterminado)" viewport="700x240" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;font-family:var(--font);color:var(--gray-dark);padding:20px;display:flex;flex-direction:column;gap:18px}
  .ms{font-family:'Material Symbols Rounded';font-feature-settings:'liga';line-height:1}
  .row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-muted);width:100%;margin-bottom:-6px}
  .item{display:flex;align-items:center;gap:10px}
  .cap{font-size:12px;color:var(--gray-700)}
  /* switch */
  .sw{width:42px;height:24px;border-radius:999px;background:var(--gray-line);position:relative;cursor:pointer;transition:background .18s;flex-shrink:0}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .18s}
  .sw.on{background:#10B981}.sw.on::after{left:20px}
  .sw.in.on{background:#6366F1}
  .sw.dis{opacity:.5;cursor:not-allowed}
  /* radio */
  .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--gray-line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .rd.on{border-color:#6366F1}.rd.on::after{content:"";width:10px;height:10px;border-radius:50%;background:#6366F1}
  /* checkbox */
  .cb{width:20px;height:20px;border-radius:6px;border:2px solid var(--gray-line);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .cb.on{background:#6366F1;border-color:#6366F1}
  .cb.on::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-1px)}
  .cb.indet{background:#6366F1;border-color:#6366F1}
  .cb.indet::after{content:"";width:9px;height:2px;background:#fff;border-radius:1px}
</style></head><body>
  <div class="row"><span class="lbl">Toggle switches</span>
    <div class="item"><span class="sw on"></span><span class="cap">Imprimir ticket auto</span></div>
    <div class="item"><span class="sw in on"></span><span class="cap">Modo cocina</span></div>
    <div class="item"><span class="sw"></span><span class="cap">Propina sugerida</span></div>
    <div class="item"><span class="sw dis on"></span><span class="cap" style="color:var(--gray-muted)">Bloqueado</span></div>
  </div>
  <div class="row"><span class="lbl">Radio buttons</span>
    <div class="item"><span class="rd on"></span><span class="cap">Comer aquí</span></div>
    <div class="item"><span class="rd"></span><span class="cap">Para llevar</span></div>
    <div class="item"><span class="rd"></span><span class="cap">A domicilio</span></div>
  </div>
  <div class="row"><span class="lbl">Checkboxes (on / off / indeterminado)</span>
    <div class="item"><span class="cb on"></span><span class="cap">Sin cebolla</span></div>
    <div class="item"><span class="cb"></span><span class="cap">Extra queso</span></div>
    <div class="item"><span class="cb indet"></span><span class="cap">Todos los extras</span></div>
  </div>
</body></html>
