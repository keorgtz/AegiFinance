<!doctype html>
<!-- @dsCard group="Components" name="Components · Progress bar (segmented)" subtitle="Barra multi-segmento para multi-pago y ocupación" viewport="700x260" -->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;font-family:var(--font);color:var(--gray-dark);padding:20px;display:flex;flex-direction:column;gap:16px}
  .ms{font-family:'Material Symbols Rounded';font-feature-settings:'liga';line-height:1}
  .case{display:flex;flex-direction:column;gap:8px}
  .lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-muted);display:flex;align-items:center;gap:8px}
  .lbl b{color:var(--gray-dark);font-weight:700}

  .bar{height:10px;border-radius:6px;background:var(--gray-line);overflow:hidden;display:flex}
  .bar span{transition:flex .3s ease}
  .bar span:not(:last-child){border-right:2px solid #fff}
  .foot{display:flex;justify-content:space-between;font-size:11px;color:var(--gray-muted);font-variant-numeric:tabular-nums}
  .foot b{color:#10B981;font-weight:800}

  .legend{display:flex;gap:14px;font-size:11px;color:var(--gray-muted)}
  .legend div{display:flex;align-items:center;gap:5px}
  .legend .dot{width:9px;height:9px;border-radius:50%}
</style></head><body>

<div class="case">
  <div class="lbl">Multi-pago · <b>67.9% cubierto</b></div>
  <div class="bar">
    <span style="flex:480;background:#10B981"></span>
    <span style="flex:720;background:#6366F1"></span>
    <span style="flex:566.25;background:#E5E7EB"></span>
  </div>
  <div class="foot"><span><b>$ 1,200.00</b> aplicados</span><span>$ 1,766.25 total</span></div>
  <div class="legend">
    <div><span class="dot" style="background:#10B981"></span>Efectivo $ 480</div>
    <div><span class="dot" style="background:#6366F1"></span>T. Crédito $ 720</div>
    <div><span class="dot" style="background:#E5E7EB"></span>Pendiente $ 566.25</div>
  </div>
</div>

<div class="case">
  <div class="lbl">Ocupación de mesas · <b>78% lleno</b></div>
  <div class="bar">
    <span style="flex:8;background:#6366F1"></span>
    <span style="flex:2;background:#F59E0B"></span>
    <span style="flex:1;background:#EC4899"></span>
    <span style="flex:3;background:#E5E7EB"></span>
  </div>
  <div class="legend">
    <div><span class="dot" style="background:#6366F1"></span>Ocupadas 8</div>
    <div><span class="dot" style="background:#F59E0B"></span>Reservadas 2</div>
    <div><span class="dot" style="background:#EC4899"></span>Bloqueadas 1</div>
    <div><span class="dot" style="background:#E5E7EB"></span>Libres 3</div>
  </div>
</div>

</body></html>
