<!doctype html>
<!-- @dsCard group="Components" name="Components · Titlebar + Statusbar" subtitle="Shell con logo Keorsoft real" viewport="1100x140" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--page-bg);font-family:var(--font);color:var(--gray-dark);padding:0}
  .titlebar{
    background:#fff;display:flex;align-items:center;justify-content:space-between;height:48px;
    border-bottom:1px solid var(--gray-line);box-shadow:var(--shadow);
  }
  .tb-left{display:flex;align-items:center;height:100%}
  .tb-logo{width:220px;height:100%;display:flex;align-items:center;gap:10px;padding:0 16px;border-right:1px solid var(--gray-line)}
  .tb-logo-icon{width:32px;height:32px;border-radius:8px;overflow:hidden;flex-shrink:0}
  .tb-logo-icon img{width:100%;height:100%;object-fit:cover;display:block}
  .tb-logo-name{font-family:var(--font-brand);font-size:16px;font-weight:700;color:var(--gray-dark);letter-spacing:-.005em}
  .tb-logo-name span{color:#0E98F8;font-weight:700}
  .crumb{display:flex;align-items:center;gap:8px;padding-left:20px;font-size:13px;color:var(--gray-muted)}
  .crumb .current{color:var(--gray-dark);font-weight:500}
  .tb-right{display:flex;align-items:center;gap:10px;padding-right:16px}
  .chip{display:flex;align-items:center;gap:6px;background:var(--gray-foot);border:1px solid var(--gray-line);border-radius:10px;padding:5px 10px;font-size:12px;color:#374151}
  .dot{width:7px;height:7px;border-radius:50%;background:#10B981}
  .ico{font-family:'Material Symbols Rounded';font-size:18px;color:var(--gray-muted);width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .ico:hover{background:var(--gray-foot)}
  .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#8B5CF6,#6366F1);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}

  .statusbar{height:28px;background:#fff;border-top:1px solid var(--gray-line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:11px;color:var(--gray-muted)}
  .sb-l,.sb-r{display:flex;align-items:center;gap:0}
  .sb-i{display:flex;align-items:center;gap:5px;padding:0 10px;border-right:1px solid var(--gray-line)}
  .sb-i:first-child{padding-left:0}
  .sb-r .sb-i{border-right:none;border-left:1px solid var(--gray-line)}
  .sb-i:last-child{border:none}
  .sb-dot{width:6px;height:6px;border-radius:50%;background:#10B981}
  .mid{height:54px;background:#fff;border-bottom:1px solid var(--gray-line);padding:0 20px;display:flex;align-items:center;justify-content:space-between}
  .mid-title{font-family:var(--font-display);font-size:17px;font-weight:700}
  .mid-sub{font-size:12px;color:#8B5CF6;font-weight:500;margin-left:10px}
</style></head><body>
  <div class="titlebar">
    <div class="tb-left">
      <div class="tb-logo"><div class="tb-logo-icon"><img src="assets/keorsoft-logo.png" alt=""/></div><div class="tb-logo-name">SH<span>Endevour</span></div></div>
      <div class="crumb"><span>Hotel Misión GDL</span><span style="opacity:.5">›</span><span class="current">Dashboard</span></div>
    </div>
    <div class="tb-right">
      <span class="chip"><span class="dot"></span>Turno Matutino</span>
      <span class="chip"><span class="ico" style="width:auto;height:auto;font-size:14px;color:var(--gray-muted)">notifications_none</span>3</span>
      <span class="ico">dark_mode</span>
      <span class="ico">help_outline</span>
      <span class="av">JR</span>
    </div>
  </div>
  <div class="mid"><div><span style="font-family:var(--font-display);font-size:17px;font-weight:700">Resumen del Día</span><span class="mid-sub">jueves, 21 de mayo de 2026</span></div></div>
  <div class="statusbar">
    <div class="sb-l"><div class="sb-i"><span class="sb-dot"></span>Conectado</div><div class="sb-i">Turno: Matutino (08:00 – 16:00)</div><div class="sb-i">Usuario: J. Rodríguez</div></div>
    <div class="sb-r"><div class="sb-i">Hotel Misión GDL</div><div class="sb-i">v2.4.1</div><div class="sb-i">Jue 21 May 2026 · 14:32</div></div>
  </div>
</body></html>
