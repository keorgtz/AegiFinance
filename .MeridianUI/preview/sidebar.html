<!doctype html>
<!-- @dsCard group="Components" name="Components · Sidebar" subtitle="Sidebar 220 px con grupos OPERACIONES / GERENCIAL" viewport="700x400" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--page-bg);font-family:var(--font);color:var(--gray-dark);padding:16px;display:flex;justify-content:center}
  .sb{width:240px;background:#fff;border:1px solid var(--gray-line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .nav-group{font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--gray-muted);text-transform:uppercase;padding:12px 16px 4px}
  .sep{height:1px;background:var(--gray-line);margin:4px 0}
  .items-wrap{padding:8px 0}
  .item{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:1px 8px;border-radius:10px;cursor:pointer;transition:background .12s}
  .item:hover{background:#F0F4FF}
  .item:hover .mi,.item:hover .name{color:#6366F1}
  .item.active{background:#EEF2FF;box-shadow:0 1px 3px rgba(99,102,241,.12)}
  .item .mi{font-family:'Material Symbols Rounded';font-size:18px;color:var(--gray-muted)}
  .item.active .mi{color:#6366F1}
  .item .name{font-size:13px;font-weight:500;color:var(--gray-muted)}
  .item.active .name{color:#6366F1;font-weight:600}
  .badge{margin-left:auto;background:#10B981;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px}
  .badge.am{background:#F59E0B}
  .foot{padding:10px 12px;border-top:1px solid var(--gray-line);display:flex;align-items:center;gap:10px}
  .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#8B5CF6,#6366F1);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .uname{font-size:12px;font-weight:600;color:var(--gray-dark)}
  .urol{font-size:10px;color:var(--gray-muted)}
</style></head><body>
  <aside class="sb">
    <div class="items-wrap">
    <div class="item active"><span class="mi">dashboard</span><span class="name">Dashboard</span></div>
    <div class="item"><span class="mi">bar_chart</span><span class="name">Métricas</span></div>
    <div class="sep"></div>
    <div class="nav-group">Operaciones</div>
    <div class="item"><span class="mi">bed</span><span class="name">Habitaciones</span></div>
    <div class="item"><span class="mi">login</span><span class="name">Registros</span><span class="badge">8</span></div>
    <div class="item"><span class="mi">event</span><span class="name">Reservas</span><span class="badge am">3</span></div>
    <div class="sep"></div>
    <div class="nav-group">Gerencial</div>
    <div class="item"><span class="mi">refresh</span><span class="name">Reproceso</span></div>
    <div class="item"><span class="mi">receipt_long</span><span class="name">Facturación</span></div>
    </div>
    <div class="foot">
      <div class="av">JR</div>
      <div style="flex:1;min-width:0">
        <div class="uname">J. Rodríguez</div>
        <div class="urol">Recepcionista · Mat.</div>
      </div>
    </div>
  </aside>
</body></html>
