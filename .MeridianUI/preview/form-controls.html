<!doctype html>
<!-- @dsCard group="Components" name="Components · Form controls (steppers, segmented, extras)" subtitle="Quantity stepper, price-edit, segmented radio, checkbox extras, quick amount" viewport="800x420" -->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;font-family:var(--font);color:var(--gray-dark);padding:20px;display:flex;flex-direction:column;gap:18px}
  .ms{font-family:'Material Symbols Rounded';font-feature-settings:'liga';line-height:1}
  .row{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--gray-line)}
  .row:last-child{border:none}
  .lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-muted);padding-top:8px}

  /* Quantity stepper */
  .qty{display:inline-flex;align-items:center;background:#fff;border:1.5px solid var(--gray-line);border-radius:10px;height:38px;width:140px;overflow:hidden}
  .qty button{border:none;background:transparent;width:38px;height:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--in)}
  .qty button:hover{background:var(--in-bg)}
  .qty .ms{font-size:20px}
  .qty input{flex:1;border:none;outline:none;text-align:center;font:700 15px var(--font);color:var(--gray-dark);font-variant-numeric:tabular-nums;background:transparent;border-left:1px solid var(--gray-line);border-right:1px solid var(--gray-line);height:100%;width:0;min-width:0}

  /* Price edit */
  .price-edit{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--gray-line);border-radius:10px;padding:8px 12px;height:42px;width:170px}
  .price-edit .currency{font-size:13px;color:var(--gray-muted);font-weight:700}
  .price-edit input{border:none;outline:none;flex:1;width:0;min-width:0;font:700 16px var(--font);color:var(--gray-dark);font-variant-numeric:tabular-nums;background:transparent}
  .price-edit .ms{font-size:16px;color:var(--gray-muted)}

  /* Segmented radio */
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg label{cursor:pointer;padding:6px 12px;border-radius:8px;border:1.5px solid var(--gray-line);font-size:12px;font-weight:600;color:var(--gray-700);background:#fff;user-select:none;transition:all .12s}
  .seg label:hover{border-color:#A5B4FC;background:#F8FAFF}
  .seg input{display:none}
  .seg input:checked + label{background:var(--in-bg);border-color:var(--in);color:var(--in);box-shadow:0 1px 3px rgba(99,102,241,.12)}

  /* Extras */
  .extras{display:flex;flex-direction:column;gap:4px;max-width:340px}
  .extra{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid var(--gray-line);cursor:pointer;transition:all .12s}
  .extra:hover{background:#F8FAFF;border-color:#C7D2FE}
  .extra input{display:none}
  .cb{width:18px;height:18px;border-radius:5px;border:1.8px solid var(--gray-line);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .extra input:checked + .cb{background:var(--in);border-color:var(--in)}
  .extra input:checked + .cb::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .extra-name{flex:1;font-size:12.5px;color:var(--gray-dark);font-weight:500}
  .extra-price{font-size:12px;color:var(--em);font-weight:700;font-variant-numeric:tabular-nums}
  .extra-price.free{color:var(--gray-muted);font-weight:600}

  /* Quick amount chips */
  .quick{display:flex;flex-wrap:wrap;gap:6px}
  .qbtn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid var(--gray-line);border-radius:10px;padding:7px 11px;cursor:pointer;font:700 12.5px var(--font);color:var(--gray-dark);font-variant-numeric:tabular-nums;transition:all .12s}
  .qbtn:hover{border-color:var(--in);background:#F8FAFF;color:var(--in)}
  .qbtn.exact{background:#DCFCE7;border-color:#10B981;color:#065F46}
  .qbtn .ms{font-size:14px;color:var(--gray-muted)}
</style></head><body>
  <div class="row"><div class="lbl">Quantity stepper</div>
    <div class="qty"><button><span class="ms">remove</span></button><input value="2"/><button><span class="ms">add</span></button></div>
  </div>
  <div class="row"><div class="lbl">Price edit</div>
    <div class="price-edit"><span class="currency">$</span><input value="380.00"/><span class="ms">edit</span></div>
  </div>
  <div class="row"><div class="lbl">Segmented radio</div>
    <div class="seg">
      <input type="radio" name="t" id="t1"/><label for="t1">Rojo</label>
      <input type="radio" name="t" id="t2"/><label for="t2">Medio rojo</label>
      <input type="radio" name="t" id="t3" checked/><label for="t3">Medio</label>
      <input type="radio" name="t" id="t4"/><label for="t4">Tres cuartos</label>
      <input type="radio" name="t" id="t5"/><label for="t5">Bien cocido</label>
    </div>
  </div>
  <div class="row"><div class="lbl">Checkbox extras</div>
    <div class="extras">
      <label class="extra"><input type="checkbox" checked/><span class="cb"></span><span class="extra-name">Mantequilla extra</span><span class="extra-price">+ $ 30.00</span></label>
      <label class="extra"><input type="checkbox"/><span class="cb"></span><span class="extra-name">Queso azul</span><span class="extra-price">+ $ 40.00</span></label>
      <label class="extra"><input type="checkbox" checked/><span class="cb"></span><span class="extra-name">Sin cebolla</span><span class="extra-price free">sin costo</span></label>
    </div>
  </div>
  <div class="row"><div class="lbl">Quick amount</div>
    <div class="quick">
      <button class="qbtn exact"><span class="ms">equal</span>Pago exacto · $ 566.25</button>
      <button class="qbtn">$ 50</button><button class="qbtn">$ 100</button><button class="qbtn">$ 200</button><button class="qbtn">$ 500</button><button class="qbtn">$ 1,000</button>
    </div>
  </div>
</body></html>
