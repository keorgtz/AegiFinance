<!doctype html>
<!-- @dsCard group="Components" name="Components · Numeric keypad" subtitle="3-col back-office y 4-col POS touch" viewport="880x340" -->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--page-bg);font-family:var(--font);color:var(--gray-dark);padding:20px}
  .ms{font-family:'Material Symbols Rounded';font-feature-settings:'liga';line-height:1;font-variation-settings:'FILL' 1,'wght' 500}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .card{background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  h4{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-muted);margin-bottom:10px}

  /* 3-col keypad */
  .pad3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .key{
    background:#fff;border:1.5px solid var(--gray-line);border-radius:10px;
    height:54px;font-family:var(--font);font-size:18px;font-weight:700;
    color:var(--gray-dark);cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:4px;
    transition:all .12s;font-variant-numeric:tabular-nums;
  }
  .key:hover{border-color:var(--in);background:#F8FAFF;color:var(--in)}
  .key .ms{font-size:20px}
  .key.fn{background:var(--gray-foot);color:var(--gray-muted)}
  .key.del{background:#FEF2F2;border-color:#FECACA;color:#B91C1C}
  .key.confirm{background:var(--in);border-color:var(--in);color:#fff;font-size:14px;letter-spacing:.04em;text-transform:uppercase}

  /* 4-col keypad */
  .pad4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .pad4 .key{height:62px;font-size:22px;font-weight:800;border-radius:12px}
  .pad4 .key.add{background:var(--in);border-color:var(--in);color:#fff;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
  .pad4 .key.add .ms{color:#fff}
</style></head><body>
<div class="grid">
  <div class="card">
    <h4>Keypad · 3-col (back-office)</h4>
    <div class="pad3">
      <button class="key">7</button><button class="key">8</button><button class="key">9</button>
      <button class="key">4</button><button class="key">5</button><button class="key">6</button>
      <button class="key">1</button><button class="key">2</button><button class="key">3</button>
      <button class="key fn">.</button><button class="key">0</button><button class="key fn">00</button>
      <button class="key del" style="grid-column:span 2"><span class="ms">backspace</span>Borrar</button>
      <button class="key confirm"><span class="ms">add</span>Aplicar</button>
    </div>
  </div>
  <div class="card">
    <h4>Keypad · 4-col (POS touch)</h4>
    <div class="pad4">
      <button class="key">7</button><button class="key">8</button><button class="key">9</button>
      <button class="key del"><span class="ms">backspace</span></button>
      <button class="key">4</button><button class="key">5</button><button class="key">6</button>
      <button class="key fn">C</button>
      <button class="key">1</button><button class="key">2</button><button class="key">3</button>
      <button class="key fn">.</button>
      <button class="key">0</button><button class="key fn">00</button>
      <button class="key add" style="grid-column:span 2"><span class="ms">add_circle</span>Aplicar</button>
    </div>
  </div>
</div>
</body></html>
