<!doctype html>
<!-- @dsCard group="Components" name="Components · Restaurant mini-metric strip" subtitle="Strip 4-up con pill rellena y sub-valor" viewport="880x110" -->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--page-bg);font-family:var(--font);color:var(--gray-dark);padding:18px}
  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .m{background:#fff;border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
  .pill{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ms{font-family:'Material Symbols Rounded';font-feature-settings:'liga';line-height:1;font-size:20px;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
  .lbl{font-size:10px;font-weight:700;color:var(--gray-muted);text-transform:uppercase;letter-spacing:.08em}
  .row{display:flex;align-items:baseline;gap:6px;margin-top:2px}
  .val{font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .sub{font-size:11px;color:var(--gray-muted)}
</style></head><body>
  <div class="strip">
    <div class="m">
      <div class="pill" style="background:#DCFCE7"><span class="ms" style="color:#10B981">point_of_sale</span></div>
      <div><div class="lbl">Ventas hoy</div><div class="row"><span class="val" style="color:#10B981">$ 18,030</span><span class="sub">avg $ 1,803</span></div></div>
    </div>
    <div class="m">
      <div class="pill" style="background:#E0E7FF"><span class="ms" style="color:#6366F1">table_restaurant</span></div>
      <div><div class="lbl">Mesas ocupadas</div><div class="row"><span class="val" style="color:#6366F1">6 / 13</span><span class="sub">46%</span></div></div>
    </div>
    <div class="m">
      <div class="pill" style="background:#FEF3C7"><span class="ms" style="color:#F59E0B">receipt</span></div>
      <div><div class="lbl">Pedidos activos</div><div class="row"><span class="val" style="color:#F59E0B">8</span><span class="sub">3 en cocina</span></div></div>
    </div>
    <div class="m">
      <div class="pill" style="background:#EDE9FE"><span class="ms" style="color:#8B5CF6">trending_up</span></div>
      <div><div class="lbl">Ticket promedio</div><div class="row"><span class="val" style="color:#8B5CF6">$ 1,803</span><span class="sub">+8% vs ayer</span></div></div>
    </div>
  </div>
</body></html>
