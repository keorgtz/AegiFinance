<!doctype html>
<!-- @dsCard group="Spacing" name="Radii" subtitle="–r-sm 6 · –r-md 10 · –r-lg 14 · –r-xl 20" viewport="700x160" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;font-family:var(--font);color:var(--gray-dark);padding:20px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .item{display:flex;flex-direction:column;align-items:center;gap:6px}
  .box{width:90px;height:60px;background:#fff;border:1.5px solid var(--in);background:linear-gradient(135deg, #E0E7FF 0%, #F5F3FF 100%)}
  .name{font-size:11px;font-weight:700;color:var(--gray-dark)}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--gray-muted)}
  .use{font-size:10px;color:var(--gray-muted);text-align:center;max-width:160px;line-height:1.4}
</style></head><body>
  <div class="grid">
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="name">--r-sm</div><div class="hex">6 px</div><div class="use">Badges · chips pequeños · inputs</div></div>
    <div class="item"><div class="box" style="border-radius:10px"></div><div class="name">--r-md</div><div class="hex">10 px</div><div class="use">Botones · chips de pago</div></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><div class="name">--r-lg</div><div class="hex">14 px</div><div class="use">Tarjetas normales</div></div>
    <div class="item"><div class="box" style="border-radius:20px"></div><div class="name">--r-xl</div><div class="hex">20 px</div><div class="use">KPI cards · Caja footer</div></div>
  </div>
</body></html>
