<!doctype html>
<!-- @dsCard group="Type" name="Type · Display & numeric" subtitle="KPI numbers + tabular nums + Montserrat caps" viewport="700x260" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;font-family:var(--font);color:var(--gray-dark);padding:20px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;align-items:baseline;gap:14px}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--gray-muted);margin-left:auto;white-space:nowrap}
  .em{color:#10B981}.am{color:#F59E0B}.in{color:#6366F1}.vi{color:#8B5CF6}
  .lbl{font-size:11px;color:var(--gray-muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
</style></head><body>
  <div class="row">
    <span class="lbl" style="width:110px">KPI grande</span>
    <span style="font-size:42px;font-weight:700;line-height:1" class="em">42</span>
    <span style="font-size:42px;font-weight:700;line-height:1" class="am">17</span>
    <span style="font-size:42px;font-weight:700;line-height:1" class="in">86</span>
    <span style="font-size:42px;font-weight:700;line-height:1" class="vi">94</span>
    <span class="meta">42 / 700</span>
  </div>
  <div class="row">
    <span class="lbl" style="width:110px">KPI medio</span>
    <span style="font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1" class="em">$ 28,140</span>
    <span style="font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1;color:#9C27B0">12</span>
    <span class="meta">Inter 28 / 700</span>
  </div>
  <div class="row" style="align-items:center;gap:24px">
    <span class="lbl" style="width:110px">Tabular nums</span>
    <span style="font-size:13px;font-weight:600;color:var(--em);font-variant-numeric:tabular-nums">$ 1,840.00</span>
    <span style="font-size:13px;font-weight:600;color:var(--cargo);font-variant-numeric:tabular-nums">$ 12,400.00</span>
    <span style="font-size:13px;font-weight:600;color:var(--or);font-variant-numeric:tabular-nums">– $ 620.00</span>
    <span class="meta">Segoe UI 13 / 600</span>
  </div>
  <div class="row">
    <span class="lbl" style="width:110px">Display caps</span>
    <span style="font-family:var(--font);font-size:22px;font-weight:700;letter-spacing:-.01em">Resumen del Día</span>
    <span class="meta">Inter 22 / 700</span>
  </div>
  <div class="row">
    <span class="lbl" style="width:110px">Brand only</span>
    <span style="font-family:var(--font-brand);font-size:22px;font-weight:700;letter-spacing:-.005em"><b>Keor</b>soft</span>
    <span class="meta">Coco Gothic 22 / 700 (asset)</span>
  </div>
</body></html>
