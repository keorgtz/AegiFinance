<!doctype html>
<!-- @dsCard group="Components" name="Components · Caja footer" subtitle="Footer 4-up con pill icons (efectivo/tarjetas/gastos/total)" viewport="820x110" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--page-bg);font-family:var(--font);color:var(--gray-dark);padding:16px}
  .caja{background:#fff;border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:center;padding:6px 8px;width:760px}
  .item{flex:1;display:flex;align-items:center;gap:12px;padding:10px 16px}
  .pill{border-radius:10px;padding:10px;display:flex;align-items:center;justify-content:center}
  .pill .mi{font-family:'Material Symbols Rounded';font-size:20px}
  .lbl{font-size:10px;font-weight:600;color:var(--gray-muted);text-transform:uppercase;letter-spacing:.06em}
  .amt{font-size:18px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
  .amt.total{font-size:22px}
  .sep{width:1px;background:var(--gray-line);height:44px}
</style></head><body>
  <div class="caja">
    <div class="item">
      <div class="pill" style="background:#DCFCE7"><span class="mi" style="color:#10B981">payments</span></div>
      <div><div class="lbl">Efectivo</div><div class="amt" style="color:#10B981">$ 18,420</div></div>
    </div>
    <div class="item">
      <div class="pill" style="background:#E0E7FF"><span class="mi" style="color:#6366F1">credit_card</span></div>
      <div><div class="lbl">Tarjetas y otros</div><div class="amt" style="color:#6366F1">$ 26,310</div></div>
    </div>
    <div class="item">
      <div class="pill" style="background:#FFEDD5"><span class="mi" style="color:#F97316">shopping_bag</span></div>
      <div><div class="lbl">Gastos / Retiros</div><div class="amt" style="color:#F97316">– $ 1,240</div></div>
    </div>
    <div class="sep"></div>
    <div class="item">
      <div class="pill" style="background:#EDE9FE"><span class="mi" style="color:#8B5CF6">account_balance_wallet</span></div>
      <div><div class="lbl">Total caja</div><div class="amt total" style="color:#8B5CF6">$ 43,490</div></div>
    </div>
  </div>
</body></html>
