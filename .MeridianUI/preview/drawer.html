<!doctype html>
<!-- @dsCard group="Components" name="App Shell · Drawer lateral" subtitle="Panel deslizante de filtros con chips, switches y footer" viewport="760x440" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:rgba(28,30,38,.28);font-family:var(--font);color:var(--gray-dark);padding:0;min-height:440px;display:flex;justify-content:flex-end}
  .ms{font-family:'Material Symbols Rounded';font-feature-settings:'liga';line-height:1}
  .drawer{width:380px;background:#fff;height:440px;box-shadow:-12px 0 40px rgba(28,30,38,.18);display:flex;flex-direction:column}
  .dh{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--gray-line)}
  .dh .ic{width:40px;height:40px;border-radius:11px;background:var(--in-bg);display:flex;align-items:center;justify-content:center}
  .dh .ic .ms{font-size:21px;color:#6366F1;font-variation-settings:'FILL' 1}
  .dh .t{flex:1}
  .dh .t .ttl{font-size:15px;font-weight:700}
  .dh .t .sub{font-size:11.5px;color:var(--gray-muted)}
  .dh .x{border:none;background:transparent;cursor:pointer;width:34px;height:34px;border-radius:9px;color:var(--gray-muted);display:flex;align-items:center;justify-content:center}
  .dh .x:hover{background:var(--gray-foot)}
  .dh .x .ms{font-size:20px}
  .db{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:16px}
  .sect .sl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gray-muted);margin-bottom:9px}
  .rowf{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:.5px solid var(--gray-line)}
  .rowf .k{font-size:12.5px;color:var(--gray-700)}
  .rowf .v{font-size:12.5px;font-weight:700;color:var(--gray-dark);font-variant-numeric:tabular-nums}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1.5px solid var(--gray-line);border-radius:999px;padding:6px 12px;font:600 11.5px var(--font);color:var(--gray-700);cursor:pointer}
  .chip.on{background:var(--in-bg);border-color:#6366F1;color:#6366F1}
  .sw{width:42px;height:24px;border-radius:999px;background:var(--gray-line);position:relative;flex-shrink:0}
  .sw.on{background:#6366F1}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .sw.on::after{left:20px}
  .df{padding:14px 18px;border-top:1px solid var(--gray-line);display:flex;gap:8px}
  .df button{flex:1;border:none;cursor:pointer;font:700 13px var(--font);padding:11px;border-radius:10px}
  .df .g{background:#fff;border:1.5px solid var(--gray-line)!important;color:var(--gray-700)}
  .df .p{background:#6366F1;color:#fff}
</style></head><body>
  <div class="drawer">
    <div class="dh">
      <div class="ic"><span class="ms">tune</span></div>
      <div class="t"><div class="ttl">Filtros y opciones</div><div class="sub">Rack de mesas · turno matutino</div></div>
      <button class="x"><span class="ms">close</span></button>
    </div>
    <div class="db">
      <div class="sect"><div class="sl">Zona</div>
        <div class="chips"><span class="chip on">Salón principal</span><span class="chip">Terraza</span><span class="chip">Barra</span><span class="chip">Privado</span></div>
      </div>
      <div class="sect"><div class="sl">Estado de mesa</div>
        <div class="chips"><span class="chip on">Ocupadas</span><span class="chip on">Atención</span><span class="chip">Libres</span><span class="chip">Reservadas</span></div>
      </div>
      <div class="sect"><div class="sl">Resumen aplicado</div>
        <div class="rowf"><span class="k">Mesas visibles</span><span class="v">7 de 13</span></div>
        <div class="rowf"><span class="k">Mesero asignado</span><span class="v">Todos</span></div>
      </div>
      <div class="sect"><div class="sl">Preferencias</div>
        <div class="rowf"><span class="k">Mostrar tiempo abierto</span><span class="sw on"></span></div>
        <div class="rowf"><span class="k">Resaltar mesas lentas</span><span class="sw on"></span></div>
        <div class="rowf" style="border:none"><span class="k">Auto-refresco 30s</span><span class="sw"></span></div>
      </div>
    </div>
    <div class="df"><button class="g">Restablecer</button><button class="p">Aplicar filtros</button></div>
  </div>
</body></html>
