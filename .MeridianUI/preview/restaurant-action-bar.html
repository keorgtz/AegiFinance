<!doctype html>
<!-- @dsCard group="Components" name="Components · Restaurant action bar" subtitle="Search + Nuevo pedido / Reservar / Combinar / Filtros + view toggle" viewport="880x100" -->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--page-bg);font-family:var(--font);color:var(--gray-dark);padding:20px}
  .bar{background:#fff;border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .search{position:relative;flex:0 0 280px}
  .search input{width:100%;border:1.5px solid var(--gray-line);border-radius:10px;padding:8px 12px 8px 36px;font-family:var(--font);font-size:12.5px;outline:none;background:#fff;color:var(--gray-dark)}
  .search input::placeholder{color:#9CA3AF}
  .search .ms{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--gray-muted);font-size:18px}
  .ms{font-family:'Material Symbols Rounded';font-feature-settings:'liga';line-height:1}

  .actions{display:flex;align-items:center;gap:6px;flex:1}
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer;font-family:var(--font);transition:all .15s;letter-spacing:.02em;white-space:nowrap}
  .btn .ms{font-size:16px}
  .raised{background:var(--primary);color:#fff;padding:0 18px;height:40px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;font-weight:600}
  .outlined{background:transparent;border:1.5px solid var(--primary);color:var(--primary);padding:0 16px;height:36px;border-radius:10px;font-size:13px;font-weight:600}
  .flat{background:transparent;color:var(--primary);padding:0 12px;height:32px;border-radius:8px;font-size:12px;font-weight:600}
  .raised .ms{font-variation-settings:'FILL' 1,'wght' 500}

  .toggle{display:flex;background:var(--gray-foot);border-radius:10px;padding:3px;gap:2px}
  .toggle button{border:none;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:var(--font);font-size:12px;font-weight:500;color:var(--gray-muted)}
  .toggle button.on{background:#fff;box-shadow:var(--shadow);font-weight:600;color:var(--gray-dark)}
  .toggle .ms{font-size:15px}
</style></head><body>
  <div class="bar">
    <div class="search">
      <span class="ms">search</span>
      <input value="Buscar mesa, mesero, cliente o platillo…" readonly />
    </div>
    <div class="actions">
      <button class="btn raised"><span class="ms">add_circle</span>Nuevo pedido</button>
      <button class="btn outlined"><span class="ms">event_available</span>Reservar mesa</button>
      <button class="btn flat"><span class="ms">local_dining</span>Combinar mesas</button>
      <button class="btn flat"><span class="ms">tune</span>Filtros</button>
    </div>
    <div class="toggle">
      <button class="on"><span class="ms">grid_view</span>Mesas</button>
      <button><span class="ms">list_alt</span>Lista</button>
    </div>
  </div>
</body></html>
