<!doctype html>
<!-- @dsCard group="Components" name="Components · Loaders & skeletons" subtitle="Spinner, dots, progress, skeleton shimmer" viewport="700x340" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;font-family:var(--font);color:var(--gray-dark);padding:22px;display:flex;flex-direction:column;gap:22px}
  .lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-muted);margin-bottom:10px}
  .row{display:flex;align-items:center;gap:30px;flex-wrap:wrap}
  /* spinner */
  .spin{width:32px;height:32px;border-radius:50%;border:3px solid var(--gray-line);border-top-color:#6366F1;animation:sp .8s linear infinite}
  .spin.sm{width:20px;height:20px;border-width:2.5px}
  .spin.em{border-top-color:#10B981}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* dots */
  .dots{display:flex;gap:6px}
  .dots span{width:9px;height:9px;border-radius:50%;background:#6366F1;animation:bo 1.2s ease-in-out infinite}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  @keyframes bo{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-7px);opacity:1}}
  /* linear */
  .lin{width:240px;height:8px;border-radius:6px;background:var(--gray-line);overflow:hidden}
  .lin span{display:block;height:100%;background:#6366F1;border-radius:6px}
  .lin .det{width:64%}
  .lin.indet span{width:40%;animation:slide 1.3s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
  /* skeleton */
  .skel-card{width:280px;border:1px solid var(--gray-line);border-radius:12px;padding:14px;display:flex;gap:12px}
  .sk{background:linear-gradient(90deg,#EEF0F3 25%,#F6F7F9 50%,#EEF0F3 75%);background-size:200% 100%;animation:shim 1.4s infinite;border-radius:6px}
  @keyframes shim{to{background-position:-200% 0}}
  .sk-av{width:44px;height:44px;border-radius:10px;flex-shrink:0}
  .sk-line{height:11px}
</style></head><body>
  <div><div class="lbl">Spinners</div>
    <div class="row">
      <div class="spin"></div>
      <div class="spin sm"></div>
      <div class="spin em"></div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </div>
  <div><div class="lbl">Barras de progreso (determinada · indeterminada)</div>
    <div class="row">
      <div class="lin"><span class="det"></span></div>
      <div class="lin indet"><span></span></div>
    </div>
  </div>
  <div><div class="lbl">Skeleton loader (carga de cards)</div>
    <div class="row">
      <div class="skel-card">
        <div class="sk sk-av"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center">
          <div class="sk sk-line" style="width:70%"></div>
          <div class="sk sk-line" style="width:45%"></div>
          <div class="sk sk-line" style="width:90%"></div>
        </div>
      </div>
      <div class="skel-card">
        <div class="sk sk-av"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center">
          <div class="sk sk-line" style="width:60%"></div>
          <div class="sk sk-line" style="width:80%"></div>
        </div>
      </div>
    </div>
  </div>
</body></html>
