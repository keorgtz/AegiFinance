<!doctype html>
<!-- @dsCard group="Components" name="Components · Saldo card + Pay button" subtitle="Tarjeta saldo full-width (warn/pos) + botón pagar emerald" viewport="700x260" -->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--page-bg);font-family:var(--font);color:var(--gray-dark);padding:22px;display:flex;flex-direction:column;gap:14px}
  .ms{font-family:'Material Symbols Rounded';font-feature-settings:'liga';line-height:1;font-variation-settings:'FILL' 1,'wght' 600}
  .saldo{
    background:#fff;border:1px solid var(--gray-line);border-radius:14px;
    padding:14px 18px;
    display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px;
  }
  .left{display:flex;flex-direction:column;gap:2px}
  .lbl{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-muted)}
  .hint{font-size:11px;color:var(--gray-muted)}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .val{font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
  .foot{font-size:10.5px;color:var(--gray-muted)}

  .warn .val{color:#F97316}
  .pos .val{color:#10B981}

  .pay{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;height:52px;border:none;cursor:pointer;
    background:#10B981;color:#fff;border-radius:12px;
    font:800 15px var(--font);letter-spacing:.05em;text-transform:uppercase;
    box-shadow:0 8px 18px rgba(16,185,129,.28), 0 1px 3px rgba(16,185,129,.30);
  }
  .pay .ms{font-size:22px}
  .pay .amount{font-variant-numeric:tabular-nums;letter-spacing:.02em;text-transform:none;font-weight:700}
</style></head><body>
  <div class="saldo warn">
    <div class="left"><div class="lbl">Saldo pendiente</div><div class="hint">Suma de comandas + servicio − descuentos</div></div>
    <div class="right"><div class="val">$ 1,766.25</div><div class="foot">en MXN · IVA incluido</div></div>
  </div>
  <button class="pay"><span class="ms">payments</span>Pagar<span class="amount">·  $ 1,766.25</span></button>
  <div class="saldo pos">
    <div class="left"><div class="lbl">Cobrado</div><div class="hint">2 formas de pago aplicadas</div></div>
    <div class="right"><div class="val">$ 1,200.00</div><div class="foot">faltan $ 566.25</div></div>
  </div>
</body></html>
