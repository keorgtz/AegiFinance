<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="Base 4 px · –s1 a –s6" viewport="700x260" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;font-family:var(--font);color:var(--gray-dark);padding:18px}
  .row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--gray-line)}
  .row:last-child{border-bottom:none}
  .label{width:60px;font-size:11px;font-weight:700;color:var(--gray-dark);font-family:var(--font-mono)}
  .bar{height:14px;background:var(--in);border-radius:3px}
  .px{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--gray-muted);width:60px;text-align:right}
  .use{font-size:11px;color:var(--gray-muted);min-width:240px}
</style></head><body>
  <div class="row"><div class="label">--s1</div><div class="bar" style="width:4px"></div><div class="use">Gap mínimo · padding interno de badge</div><div class="px">4 px</div></div>
  <div class="row"><div class="label">--s2</div><div class="bar" style="width:8px"></div><div class="use">Gap entre chips · padding mini</div><div class="px">8 px</div></div>
  <div class="row"><div class="label">--s3</div><div class="bar" style="width:12px"></div><div class="use">Padding tarjeta pequeña</div><div class="px">12 px</div></div>
  <div class="row"><div class="label">--s4</div><div class="bar" style="width:16px"></div><div class="use">Padding estándar de tarjeta</div><div class="px">16 px</div></div>
  <div class="row"><div class="label">--s5</div><div class="bar" style="width:20px"></div><div class="use">Padding sección / header</div><div class="px">20 px</div></div>
  <div class="row"><div class="label">--s6</div><div class="bar" style="width:24px"></div><div class="use">Margen entre secciones</div><div class="px">24 px</div></div>
</body></html>
