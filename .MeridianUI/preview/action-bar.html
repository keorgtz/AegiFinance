<!doctype html>
<!-- @dsCard group="Components" name="Components · Action bar (dialog)" subtitle="Label + primary CTA + N flat + danger flat al final" viewport="760x130" -->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;font-family:var(--font);color:var(--gray-dark);padding:20px}
  .ms{font-family:'Material Symbols Rounded';font-feature-settings:'liga';line-height:1}
  .act{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding:10px 14px;background:var(--gray-foot);
    border-radius:10px;border:1px solid var(--gray-line);
  }
  .lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-muted);margin-right:6px}
  .btn{
    display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer;
    font-family:var(--font);font-size:12px;font-weight:600;letter-spacing:.02em;
    padding:7px 12px;border-radius:8px;height:32px;
    background:#fff;color:var(--gray-700);border:1px solid var(--gray-line);
    transition:all .12s;
  }
  .btn:hover{background:#F3F4F6;border-color:#D1D5DB;color:var(--gray-dark)}
  .btn .ms{font-size:15px;color:var(--gray-muted)}
  .btn.primary{background:var(--in);border-color:var(--in);color:#fff}
  .btn.primary:hover{background:#4F46E5;border-color:#4F46E5}
  .btn.primary .ms{color:#fff;font-variation-settings:'FILL' 1,'wght' 500}
  .btn.danger{color:#B91C1C}
  .btn.danger:hover{background:#FEE2E2;border-color:#FCA5A5;color:#7F1D1D}
  .btn.danger .ms{color:#B91C1C}
  .meta{font-size:11px;color:var(--gray-muted);margin-top:12px;line-height:1.5}
  .meta b{color:var(--gray-dark)}
</style></head><body>
  <div class="act">
    <span class="lbl">Acciones</span>
    <button class="btn primary"><span class="ms">add_circle</span>Agregar comanda</button>
    <button class="btn"><span class="ms">print</span>Reimprimir ticket</button>
    <button class="btn"><span class="ms">receipt</span>Imprimir cuenta</button>
    <button class="btn"><span class="ms">swap_horiz</span>Trasladar mesa</button>
    <button class="btn"><span class="ms">percent</span>Aplicar descuento</button>
    <button class="btn"><span class="ms">edit_note</span>Notas</button>
    <button class="btn danger"><span class="ms">cancel</span>Cancelar pedido</button>
  </div>
  <div class="meta"><b>Patrón action bar</b>: fondo <code>--gray-foot</code> + label izquierdo + 1 primary CTA + N flat secondary + 1 danger flat al final. Pensado para vivir bajo el title bar de cualquier dashboard de operación.</div>
</body></html>
