<!doctype html>
<!-- @dsCard group="Components" name="Components · Mini KPI strips" subtitle="Verde / naranja / azul — footer del Reproceso" viewport="700x90" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--page-bg);font-family:var(--font);color:var(--gray-dark);padding:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .mini{display:flex;align-items:center;gap:10px;border-radius:8px;padding:10px 14px;border:1px solid;min-width:170px}
  .mi{font-family:'Material Symbols Rounded';font-size:20px}
  .lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-muted)}
  .val{font-size:16px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
  .g{background:#E8F5E9;border-color:#A5D6A7} .g .val{color:#2E7D32} .g .mi{color:#2E7D32}
  .o{background:#FFF3E0;border-color:#FFCC80} .o .val{color:#BF360C} .o .mi{color:#BF360C}
  .b{background:#E3F2FD;border-color:#90CAF9} .b .val{color:#0D47A1} .b .mi{color:#0D47A1}
</style></head><body>
  <div class="mini g"><span class="mi">check_circle</span><div><div class="lbl">A REPROCESAR</div><div class="val">$ 12,840</div></div></div>
  <div class="mini o"><span class="mi">storefront</span><div><div class="lbl">VENTAS AL PÚBLICO</div><div class="val">$ 4,210</div></div></div>
  <div class="mini b"><span class="mi">receipt_long</span><div><div class="lbl">YA FACTURADAS</div><div class="val">$ 28,140</div></div></div>
</body></html>
