<!doctype html>
<!-- @dsCard group="Components" name="Components · Method picker cards" subtitle="Grid 3×2 · 6 métodos de pago con icon-pill semantico" viewport="700x280" -->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;font-family:var(--font);color:var(--gray-dark);padding:18px}
  .ms{font-family:'Material Symbols Rounded';font-feature-settings:'liga';line-height:1;font-variation-settings:'FILL' 1,'wght' 500}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .mcard{
    background:#fff;border:1.5px solid var(--gray-line);border-radius:14px;
    padding:14px 12px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
    transition:all .15s;position:relative;min-height:108px;
  }
  .mcard:hover{border-color:#A5B4FC;background:#F8FAFF;transform:translateY(-1px)}
  .mcard.active{border-color:transparent;background:linear-gradient(180deg,#EEF2FF 0%,#F5F3FF 100%);box-shadow:0 6px 14px rgba(99,102,241,.18),0 0 0 2px var(--in)}
  .mcard.active::after{content:"\\e5ca";font-family:'Material Symbols Rounded';position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--in);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;font-variation-settings:'FILL' 1,'wght' 700}
  .micon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .micon .ms{font-size:24px}
  .mname{font-size:12.5px;font-weight:700;color:var(--gray-dark);line-height:1.15}
  .msub{font-size:10px;color:var(--gray-muted);font-weight:600;font-variant-numeric:tabular-nums}
  .mcard.active .mname{color:var(--in)}
  .efec .micon{background:#DCFCE7}.efec .micon .ms{color:#10B981}
  .tcred .micon{background:#E0E7FF}.tcred .micon .ms{color:#1565C0}
  .tdeb .micon{background:#EDE9FE}.tdeb .micon .ms{color:#7B1FA2}
  .trans .micon{background:#FEF3C7}.trans .micon .ms{color:#E65100}
  .vale .micon{background:#FFEDD5}.vale .micon .ms{color:#F97316}
  .usd .micon{background:#E5E7EB}.usd .micon .ms{color:#374151}
</style></head><body>
  <div class="grid">
    <div class="mcard efec active"><div class="micon"><span class="ms">payments</span></div><div class="mname">Efectivo</div><div class="msub">MXN</div></div>
    <div class="mcard tcred"><div class="micon"><span class="ms">credit_card</span></div><div class="mname">T. Crédito</div><div class="msub">Visa · MC · AmEx</div></div>
    <div class="mcard tdeb"><div class="micon"><span class="ms">credit_card</span></div><div class="mname">T. Débito</div><div class="msub">Visa · MC</div></div>
    <div class="mcard trans"><div class="micon"><span class="ms">swap_horiz</span></div><div class="mname">Transferencia</div><div class="msub">SPEI</div></div>
    <div class="mcard vale"><div class="micon"><span class="ms">card_giftcard</span></div><div class="mname">Vale</div><div class="msub">despensa · gas</div></div>
    <div class="mcard usd"><div class="micon"><span class="ms">currency_exchange</span></div><div class="mname">USD</div><div class="msub">tipo 17.84</div></div>
  </div>
</body></html>
